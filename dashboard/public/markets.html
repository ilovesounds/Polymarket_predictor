<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets · Polymarket BTC Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="markets">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Polymarket BTC</h1>
        <p class="brand-sub">Active markets</p>
      </div>
    </div>
    <nav class="app-nav" aria-label="Dashboard">
      <a href="/live">Live</a>
      <a href="/orderbook">Orderbook</a>
      <a href="/bot">Bot</a>
      <a href="/markets">Markets</a>
      <a href="/backtest">Backtest</a>
      <a href="/docs">Docs</a>
    </nav>
    <div class="top-controls">
      <label class="control-group" for="poly-mode-select">
        <span class="control-label">Market window</span>
        <select id="poly-mode-select" class="control-input">
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="both">both</option>
        </select>
      </label>
    </div>
    <div class="status-bar">
      <span id="ws-status" class="pill off">WS disconnected</span>
      <span id="binance-status" class="pill off">Binance —</span>
      <span id="poly-status" class="pill off">Polymarket —</span>
      <span id="bot-status" class="pill">Bot idle</span>
    </div>
  </header>

  <main class="page-main">
    <section class="card-panel page-panel">
      <div class="panel-head">
        <div class="panel-title-block">
          <h2>BTC short-window markets</h2>
          <p class="market-title muted-title">5m / 15m windows · time to resolve</p>
        </div>
        <span class="meta" id="markets-meta">—</span>
      </div>
      <div class="markets-table" id="markets-table"></div>
    </section>
  </main>

  <script src="/js/core.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/markets.js"></script>
</body>
</html>
