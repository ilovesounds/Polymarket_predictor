<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderbook · Polymarket BTC Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="orderbook">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Polymarket BTC</h1>
        <p class="brand-sub">Orderbook depth</p>
      </div>
    </div>
    <nav class="app-nav" aria-label="Dashboard">
      <a href="/live">Live</a>
      <a href="/orderbook">Orderbook</a>
      <a href="/bot">Bot</a>
      <a href="/markets">Markets</a>
      <a href="/backtest">Backtest</a>
      <a href="/docs">Docs</a>
    </nav>
    <div class="top-controls">
      <label class="control-group" for="poly-mode-select">
        <span class="control-label">Market window</span>
        <select id="poly-mode-select" class="control-input">
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="both">both</option>
        </select>
      </label>
    </div>
    <div class="status-bar">
      <span id="ws-status" class="pill off">WS disconnected</span>
      <span id="binance-status" class="pill off">Binance —</span>
      <span id="poly-status" class="pill off">Polymarket —</span>
      <span id="bot-status" class="pill">Bot idle</span>
    </div>
  </header>

  <main class="page-main">
    <section class="card-panel page-panel">
      <div class="panel-head">
        <div class="panel-title-block">
          <h2>Primary market orderbook</h2>
          <p class="market-title" id="poly-market-title">Waiting for market…</p>
        </div>
        <div class="panel-head-meta">
          <span id="poly-resolution" class="resolution-pill" hidden>—</span>
          <span class="meta" id="ob-updated">—</span>
        </div>
      </div>

      <div class="orderbook-full-grid">
        <article class="book-side-card">
          <h3 class="book-side-title outcome-yes-title">YES</h3>
          <div class="book-summary">
            <div class="book-row"><span>Best bid</span><strong id="ob-yes-best-bid">—</strong></div>
            <div class="book-row"><span>Best ask</span><strong id="ob-yes-best-ask">—</strong></div>
            <div class="book-row"><span>Top5 depth</span><strong id="ob-yes-depth">—</strong></div>
          </div>
          <div class="ladder-columns">
            <div>
              <div class="mini-label">Bids</div>
              <div class="ladder ladder-tall" id="ob-yes-bid-ladder"></div>
            </div>
            <div>
              <div class="mini-label">Asks</div>
              <div class="ladder ladder-tall" id="ob-yes-ask-ladder"></div>
            </div>
          </div>
        </article>
        <article class="book-side-card">
          <h3 class="book-side-title outcome-no-title">NO</h3>
          <div class="book-summary">
            <div class="book-row"><span>Best bid</span><strong id="ob-no-best-bid">—</strong></div>
            <div class="book-row"><span>Best ask</span><strong id="ob-no-best-ask">—</strong></div>
            <div class="book-row"><span>Top5 depth</span><strong id="ob-no-depth">—</strong></div>
          </div>
          <div class="ladder-columns">
            <div>
              <div class="mini-label">Bids</div>
              <div class="ladder ladder-tall" id="ob-no-bid-ladder"></div>
            </div>
            <div>
              <div class="mini-label">Asks</div>
              <div class="ladder ladder-tall" id="ob-no-ask-ladder"></div>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="/js/core.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/orderbook.js"></script>
</body>
</html>
